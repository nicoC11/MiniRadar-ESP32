; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Target environment configuration for ESP32
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Partition table (allocates larger application space for HTTPS/JSON/TFT stack)
board_build.partitions = huge_app.csv

; Serial monitor communication speed
monitor_speed = 115200

; External library dependencies managed automatically by PlatformIO
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    bodmer/TFT_eSPI @ ^2.5.43

; Global preprocessor flags and TFT_eSPI setup configuration
build_flags =
    ; Force TFT_eSPI to ignore internal User_Setup.h and use these build flags instead
    -DUSER_SETUP_LOADED=1

    ; Display driver model and resolution setup (ST7789 240x320)
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; Hardware SPI and GPIO pin assignments
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=13
    -DTFT_BACKLIGHT_ON=HIGH

    ; Color space ordering and display inversion settings
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1

    ; Font loading (enables GLCD, custom size fonts, and smooth font engine)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; SPI bus clock speed tuning (27 MHz write / 20 MHz read)
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000